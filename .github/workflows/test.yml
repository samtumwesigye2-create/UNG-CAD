name: UNG-CAD Tests

on:
  push:
    branches: [main, "feature/**", "test/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check 3D viewer runtime
        run: node --check ung-cad-3d/viewer.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install -r ung-cad-3d/requirements.txt
          python -m pip install sympy
          if [ -f ung-cad-3d/requirements-dev.txt ]; then python -m pip install -r ung-cad-3d/requirements-dev.txt; fi
      - name: Run root regression tests
        run: python -m pytest -q --ignore=ung-cad-3d/tests
      - name: Run UNG-CAD-3D fix regression suite
        working-directory: ung-cad-3d
        env:
          PYTHONPATH: ${{ github.workspace }}/ung-cad-3d/tests:${{ github.workspace }}/ung-cad-3d
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser-engine regression suite
        run: |
          set -euo pipefail
          node ung-cad-3d/tests/rib-geometry-factory.test.js
          node ung-cad-3d/tests/analyze-engine.test.js
          node ung-cad-3d/tests/strength-engine.test.js
          node ung-cad-3d/tests/analytic-workflow.test.js
          node ung-cad-3d/tests/engineering-math.test.js
          node ung-cad-3d/tests/fourd-geometry-playback.test.js
          node ung-cad-3d/tests/ung-ml-engine.test.js
          node ung-cad-3d/tests/professional-core.test.js
          node ung-cad-3d/tests/professional-platform.test.js
          node ung-cad-3d/tests/workspace-smoke.test.js
          node ung-cad-3d/tests/ung-electrical.test.js
          node ung-cad-3d/tests/hyper-import-ui.test.js
      - name: Validate Studio integration contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          studio=Path("ung-cad-3d/studio.html").read_text()
          viewer=Path("ung-cad-3d/viewer.html").read_text()
          drafting=Path("ung-cad-3d/drafting.html").read_text()
          required=["professional-core.js","interoperability.js","geospatial.js","performance-monitor.js","plugin-api.js"]
          missing=[x for x in required if x not in studio]
          assert not missing, f"Studio missing professional modules: {missing}"
          assert "professional-ui.js" in viewer
          assert "drafting-professional.js" in drafting
          assert "Professional Platform Diagnostics" in studio
          print("Studio integration contracts passed")
          PY
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      - name: Render DRACO-Mini STL geometry
        run: |
          set -euo pipefail
          mkdir -p build/draco-mini
          openscad -o build/draco-mini/rotating_base.stl projects/draco-mini/parts/rotating_base.scad
          openscad -o build/draco-mini/pan_tilt_cradle.stl projects/draco-mini/parts/pan_tilt_cradle.scad
          openscad -o build/draco-mini/sensor_shell.stl projects/draco-mini/parts/sensor_shell.scad
          openscad -o build/draco-mini/camera_insert.stl projects/draco-mini/parts/camera_insert.scad
          openscad -o build/draco-mini/electronics_cartridge.stl projects/draco-mini/parts/electronics_cartridge.scad
          openscad -o build/draco-mini/assembly.stl projects/draco-mini/assembly.scad
          test -s build/draco-mini/rotating_base.stl
          test -s build/draco-mini/pan_tilt_cradle.stl
          test -s build/draco-mini/sensor_shell.stl
          test -s build/draco-mini/camera_insert.stl
          test -s build/draco-mini/electronics_cartridge.stl
          test -s build/draco-mini/assembly.stl
      - name: Publish DRACO-Mini STL bundle
        uses: actions/upload-artifact@v4
        with:
          name: draco-mini-stl
          path: build/draco-mini/*.stl
          if-no-files-found: error
