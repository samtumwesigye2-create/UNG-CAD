name: Restore UNG-CAD release gates

on:
  push:
    branches: ["test/ung-cad-fixes-2026-10-06"]
    paths:
      - ".integration/restore_release_gates.py"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore production release gates into integrated implementation
        run: python .integration/restore_release_gates.py
      - name: Parse check restored Python
        run: python -m py_compile ung-cad-3d/main.py ung-cad-3d/ung-cad-ad5m-bridge.py
      - name: Run release-gate regression tests
        run: python -m pytest -q tests/test_ad5m_direct_print_gate.py tests/test_mandatory_pre_slice_gate.py
      - name: Commit restored gates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ung-cad-3d/main.py ung-cad-3d/ung-cad-ad5m-bridge.py
          if git diff --cached --quiet; then
            echo "No release-gate changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve production release gates in UNG-CAD fixes"
          git push origin HEAD:test/ung-cad-fixes-2026-10-06
