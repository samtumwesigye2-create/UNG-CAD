name: Apply reviewed UNG-CAD fixes

on:
  push:
    branches: ["test/ung-cad-fixes-2026-10-06"]
    paths:
      - ".integration/core_fixes.b64.part*"
      - ".github/workflows/apply-ung-cad-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged transfer chunks
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          a36f2ac0a4f6fdd5caa188eea12c1eb5382254e66e12652ea2a64689eb8266a4  .integration/core_fixes.b64.part01
          76de30a44dbcf2b24135d6280106fa38f35b64aed1cc859f6b7255f3e5d42c66  .integration/core_fixes.b64.part02
          cd9f183ed6959a3fb31457fcc9fa5fca91928799aa319d3242054a0bcb149013  .integration/core_fixes.b64.part03
          4f416f9a5ddf56c4dd82b17fee3bb4bf759035c429cc9c18adce3d6b503a8766  .integration/core_fixes.b64.part04
          63ce009a2a67abe4599d8d25e35c8f5615b2942f57d7c539f66ee1175727c43b  .integration/core_fixes.b64.part05
          82d4a8458af059a4e5f02304fca8d29d4a51a64a24809b1ba8393e200a1c538a  .integration/core_fixes.b64.part06
          34c5fea4a81ae9c521ed6d9b82ce56e3e752e5147a75084a29b2cb63fab1c741  .integration/core_fixes.b64.part07
          4253c6698169dd9d9517ca1fc6f14e4f82ca5df880a03cb898b3445e96b36f11  .integration/core_fixes.b64.part08a
          99cfc847a3a457c534f8c20737f37504223d6e178bb5f9f24cc587c50e6082d9  .integration/core_fixes.b64.part08b
          f7cc93a9ca8e20600c5e8dff2bae16b6baaffd7919b762e3c254a91991c5a586  .integration/core_fixes.b64.part08c
          cde0dead3a6f50f6dd5296c3cafa4f014e7f927beec9c5aa9124fe181e7cbd4d  .integration/core_fixes.b64.part08d
          66944edfda4619a78d21d2adf8f53b057b362ec04e8995940699cc6a7c8722bd  .integration/core_fixes.b64.part09
          5d97b8a40299c8f151509ba7f54e1db515f44919c112a18579fcffa369cca3c5  .integration/core_fixes.b64.part10
          EOF
          sha256sum -c /tmp/chunks.sha256
      - name: Decode and apply reviewed core fixes
        run: |
          set -euo pipefail
          cat \
            .integration/core_fixes.b64.part01 \
            .integration/core_fixes.b64.part02 \
            .integration/core_fixes.b64.part03 \
            .integration/core_fixes.b64.part04 \
            .integration/core_fixes.b64.part05 \
            .integration/core_fixes.b64.part06 \
            .integration/core_fixes.b64.part07 \
            .integration/core_fixes.b64.part08a \
            .integration/core_fixes.b64.part08b \
            .integration/core_fixes.b64.part08c \
            .integration/core_fixes.b64.part08d \
            .integration/core_fixes.b64.part09 \
            .integration/core_fixes.b64.part10 > /tmp/core_fixes.b64
          base64 -d /tmp/core_fixes.b64 > /tmp/core_fixes.zip
          unzip -t /tmp/core_fixes.zip
          unzip -o /tmp/core_fixes.zip -d ung-cad-3d
          python -m py_compile ung-cad-3d/main.py ung-cad-3d/slicer.py ung-cad-3d/slicer_cnc.py ung-cad-3d/ung-cad-ad5m-bridge.py
      - name: Commit applied fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ung-cad-3d
          if git diff --cached --quiet; then
            echo "No fix changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate reviewed UNG-CAD core fixes"
          git push origin HEAD:test/ung-cad-fixes-2026-10-06
