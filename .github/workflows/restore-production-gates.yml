name: Restore UNG-CAD production gates

on:
  push:
    branches: ["test/ung-cad-fixes-2026-10-06"]
    paths:
      - ".github/workflows/restore-production-gates.yml"
      - ".integration/restore_production_gates.py"

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install -r ung-cad-3d/requirements.txt
          python -m pip install sympy
          if [ -f ung-cad-3d/requirements-dev.txt ]; then python -m pip install -r ung-cad-3d/requirements-dev.txt; fi
      - name: Restore hard locks
        run: python .integration/restore_production_gates.py
      - name: Verify gate regressions first
        run: |
          python -m py_compile ung-cad-3d/main.py ung-cad-3d/ung-cad-ad5m-bridge.py
          python -m pytest -q tests/test_ad5m_direct_print_gate.py tests/test_mandatory_pre_slice_gate.py
      - name: Verify all Python regressions
        run: |
          python -m pytest -q --ignore=ung-cad-3d/tests
          (cd ung-cad-3d && python -m pytest -q)
      - name: Commit restored gates only after green tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ung-cad-3d/main.py ung-cad-3d/ung-cad-ad5m-bridge.py
          git rm -f .integration/restore_production_gates.py
          git rm -f .github/workflows/restore-production-gates.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve mandatory production gates in UNG-CAD core"
          git push origin HEAD:test/ung-cad-fixes-2026-10-06
