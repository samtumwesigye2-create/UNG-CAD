<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-CAD Data Twin</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b5b;color:#fff;font:14px Arial,sans-serif}.top{padding:18px 22px;border-bottom:1px solid #5365ba;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:2fr 1fr;height:calc(100vh - 70px)}#view{position:relative;background:radial-gradient(circle,#293b91,#11194f);overflow:hidden}.part{position:absolute;padding:18px;border:2px solid #70d8ff;border-radius:14px;background:#24398d;cursor:pointer;box-shadow:0 8px 30px #0005}.part.active{outline:4px solid #fff}.p1{left:42%;top:10%}.p2{left:25%;top:35%}.p3{left:58%;top:38%}.p4{left:41%;top:65%}.side{padding:20px;background:#18266d;overflow:auto}.row{padding:12px 0;border-bottom:1px solid #4254a7}.label{color:#aeb9ef;font-size:12px}.value{font-size:16px;margin-top:5px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{padding:7px 9px;background:#2d43a0;border-radius:8px}button{background:#55cfea;border:0;border-radius:8px;padding:10px 12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr;height:auto}#view{height:48vh}}</style></head><body>
<header class="top"><b>UNG-CAD • 3D Object ↔ Data Twin</b><button onclick="location.href='/studio.html'">Studio</button></header><main class="grid"><section id="view"><div class="part p1" data-id="sensor">Sensor / Module</div><div class="part p2" data-id="carrier">Carrier</div><div class="part p3" data-id="joint">Joint</div><div class="part p4" data-id="base">Base / Electronics</div></section><aside class="side"><h2 id="name">Select a component</h2><div class="row"><div class="label">PART ID</div><div class="value" id="id">—</div></div><div class="row"><div class="label">ENGINEERING DATA</div><div class="chips" id="eng"></div></div><div class="row"><div class="label">RELATIONSHIPS</div><div class="chips" id="rel"></div></div><div class="row"><div class="label">SYSTEM LINKS</div><div class="chips" id="sys"></div></div><div class="row"><div class="label">LIVE / CONFIGURATION DATA</div><div class="value" id="live">Select a component to correlate its physical representation with data.</div></div></aside></main>
<script>
const twins={sensor:{name:"Sensor / Module",eng:["dimensions","material","mount","orientation"],rel:["carrier","wiring","BOM"],sys:["DRACO telemetry","VECTOR traceability"],live:"Ready for sensor health, configuration and event binding."},carrier:{name:"Sensor / Electronics Carrier",eng:["dimensions","material","print profile","tolerances"],rel:["sensor modules","joint","fasteners"],sys:["CAD BOM","VECTOR inventory"],live:"Ready for manufacturing and assembly records."},joint:{name:"Pan / Tilt Joint",eng:["axis","clearance","material","load"],rel:["carrier","servo","base"],sys:["CAD assembly","DRACO pan/tilt"],live:"Ready for actuator position and health binding."},base:{name:"Base / Electronics",eng:["envelope","material","service access","print profile"],rel:["compute","power","joint"],sys:["CAD BOM","VECTOR lots","DRACO edge"],live:"Ready for compute, power and service telemetry."}};
function renderTwin(key,d,sourceEl){document.querySelectorAll(".part").forEach(x=>x.classList.remove("active"));if(sourceEl)sourceEl.classList.add("active");name.textContent=d.name;id.textContent=key;eng.innerHTML=d.eng.map(x=>'<span class="chip">'+x+'</span>').join("");rel.innerHTML=d.rel.map(x=>'<span class="chip">'+x+'</span>').join("");sys.innerHTML=d.sys.map(x=>'<span class="chip">'+x+'</span>').join("");live.textContent=d.live}
document.querySelectorAll(".part").forEach(el=>el.onclick=()=>renderTwin(el.dataset.id.toUpperCase(),twins[el.dataset.id],el));
try{const raw=sessionStorage.getItem('ungcad_twin_object');if(raw){const o=JSON.parse(raw),d={name:o.name||'Selected CAD Object',eng:['Envelope '+(o.envelope||[]).join(' × '),'Faces '+(o.faces??'—'),'Position '+[o.position?.x??0,o.position?.y??0,o.position?.z??0].join(', ')],rel:['CAD scene','BOM relationship','manufacturing record'],sys:['UNG-CAD geometry','VECTOR traceability','live telemetry binding'],live:'Real CAD object received from the Three.js viewer. Data Twin correlation is active; external records populate as integrations provide them.'};renderTwin('PART '+o.id,d,null);const view=document.getElementById('view');const badge=document.createElement('div');badge.className='part active';badge.style.cssText='left:35%;top:38%;max-width:45%;text-align:center';badge.textContent=o.name+' • '+(o.envelope||[]).join(' × ');view.appendChild(badge)}}catch(e){console.warn('Twin handoff unavailable',e)}
</script></body></html>
