<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG Photo Studio</title><style>body{margin:0;background:#111a40;color:#fff;font:16px system-ui}header,section{padding:16px}header{background:#22347b}button,input{margin:5px;padding:10px}canvas{max-width:100%;height:auto;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0/20px 20px}main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;padding:16px}aside{background:#202d64;padding:15px}#status{color:#b8d6ff}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><a href="./studio.html" style="color:white">← UNG-CAD</a><h1>Photo Studio</h1><p>Browser image preparation workspace · PhotoCraft engine not yet connected</p></header><section><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="reset">Reset</button><button id="export">Export PNG</button><span id="status" role="status">Choose a PNG, JPEG or WebP image.</span></section><main><div><canvas id="canvas" width="800" height="500" aria-label="Image preview"></canvas></div><aside><label>Brightness <input id="brightness" type="range" min="0" max="200" value="100"></label><label>Contrast <input id="contrast" type="range" min="0" max="200" value="100"></label><p>PSD editing, layers and masks require the upstream PhotoCraft runtime and are not available in this browser adapter.</p></aside></main><script>
const file=document.getElementById('file'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let img=null;
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!img)return;ctx.filter='brightness('+brightness.value+'%) contrast('+contrast.value+'%)';ctx.drawImage(img,0,0);ctx.filter='none'}
file.onchange=async()=>{const f=file.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){status.textContent='Unsupported image format';return}const url=URL.createObjectURL(f);const next=new Image();next.onload=()=>{img=next;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw();status.textContent=f.name;URL.revokeObjectURL(url)};next.onerror=()=>{status.textContent='Unable to decode image';URL.revokeObjectURL(url)};next.src=url};
brightness.oninput=draw;contrast.oninput=draw;reset.onclick=()=>{brightness.value=100;contrast.value=100;draw()};document.getElementById('export').onclick=()=>{if(!img){status.textContent='Load an image first';return}canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ung-image.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
</script></body></html>
