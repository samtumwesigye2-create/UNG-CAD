<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-CAD Manufacturing</title>
<style>body{font-family:system-ui;margin:0;background:#111827;color:#e5e7eb}header{padding:18px;background:#1f2937}main{padding:18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.card{background:#1f2937;border-radius:12px;padding:16px}button{padding:10px}pre{white-space:pre-wrap}</style></head>
<body><header><b>UNG-CAD Manufacturing</b> · Operations Dashboard</header><main>
<section class="card"><h3>System</h3><button onclick="load()">Refresh</button><pre id="health">Loading…</pre></section>
<section class="card"><h3>Machines</h3><pre id="machines">Loading…</pre></section>
<section class="card"><h3>Jobs</h3><pre id="jobs">Loading…</pre></section>
</main><script>
async function j(u){let r=await fetch(u);return r.json()} async function load(){health.textContent=JSON.stringify(await j('/api/manufacturing/health'),null,2);machines.textContent=JSON.stringify(await j('/api/machines'),null,2);jobs.textContent=JSON.stringify(await j('/api/jobs?limit=20'),null,2)}load()
</script></body></html>
