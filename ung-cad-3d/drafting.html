<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNG-CAD 2D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,-apple-system,sans-serif;background:#243986;color:#fff}.app{display:grid;grid-template-columns:220px 1fr;height:100vh}.bar{background:#2e4596;padding:12px;border-right:1px solid rgba(255,255,255,.25);overflow:auto}.bar h1{font-size:20px;margin:0 0 8px}.home{display:block;background:#fff;color:#27408c;text-decoration:none;text-align:center;padding:6px;margin-bottom:10px}.bar button,.bar input{width:100%;margin:3px 0;padding:7px;border:1px solid #a7b2dc;background:#fff;color:#263b82}.bar button.active{background:#59d6e7;font-weight:bold}.canvasWrap{background:#f6f7fb;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;background:white}.label{font-size:11px;margin-top:8px;color:#d8e0ff}.status{font-size:11px;margin-top:10px;color:#cfe8ff;white-space:pre-wrap}@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 65vh}.bar{border-right:0;border-bottom:1px solid rgba(255,255,255,.25)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.bar button{min-height:38px}}.cmd{display:flex;gap:4px}.cmd input{flex:1}.cmd button{width:auto}.mtext-editor{position:absolute;z-index:5;min-width:180px;min-height:80px;padding:8px;border:1px solid #59d6e7;background:#fff;color:#111;box-shadow:0 8px 24px #0004}table.pro-table{border-collapse:collapse;background:#fff;color:#111}table.pro-table td{border:1px solid #333;padding:4px}
</style></head><body><div class="app"><aside class="bar"><h1>UNG-CAD 2D</h1><a class="home" href="./studio.html">← Home</a><div class="tools"><button class="tool active" data-tool="line">Line / Wall</button><button class="tool" data-tool="rect">Rectangle</button><button class="tool" data-tool="circle">Circle</button><button class="tool" data-tool="label">Label</button><button class="tool" data-tool="dimension">Dimension</button><button class="tool" data-tool="select">Select / Delete</button><button id="mtext-btn">MTEXT</button><button id="table-btn">Table</button><button id="qr-btn">QR Code</button><button id="svg-import-btn">Import SVG</button><input id="svg-file" type="file" accept=".svg,image/svg+xml" hidden></div><div class="label">Drawing name</div><input id="drawing-name" value="Untitled"><div class="label">Grid size (mm)</div><input id="grid-size" type="number" value="5" step="0.5"><div class="label">Model units</div><input value="millimeters (mm)" disabled><button id="save">Save locally</button><button id="export">Export SVG</button><button id="data-extract-btn">Extract Drawing Data</button><button id="detach-btn">Detach Drawing</button><div class="label">Professional command</div><div class="cmd"><input id="pro2d-command" placeholder="MTEXT, TABLE, QRCODE, SVGIMPORT…"><button id="pro2d-run">Run</button></div><div id="status" class="status">Ready.</div></aside><main class="canvasWrap" id="wrap"><canvas id="canvas"></canvas></main></div><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script><script src="./professional-core.js"></script><script src="./drafting.js"></script><script src="./drafting-professional.js"></script></body></html>
